# First real validation of the vllm engine translator (see
# llapdance/plugins/engine/vllm.py, VALIDATION.md "vLLM engine translator"
# section). Uses the PUBLISHED intel/vllm:latest image, not the
# unpublished urakozz/vllm-xpu-env fork the translator's CLI/env shape was
# originally read from - proves the translator depends only on the shared
# contract, not the fork's internals.
#
# Model: mlabonne/gemma-3-12b-it-abliterated, a raw bf16 HF safetensors
# checkpoint (model_type: gemma3) that no other engine here can load -
# arcaine only dispatches a narrow model_type allowlist, llama-cpp-sycl/
# qxmx need GGUF, openarc needs OpenVINO IR. 23GB, chosen specifically
# because it fits the ~32GB VRAM on the validated GPU (see VALIDATION.md -
# the dense Qwen3.5-27B at 52GB did NOT fit and was never run for this
# reason).
name: validation-vllm-gemma3-12b

backends:
  - name: vllm-gemma3-12b
    source:
      mode: prebuilt
      image: "intel/vllm:latest"
    model: "gemma-3-12b-it-abliterated"
    # GOTCHA (same class of bug as the Arcaine AEON-7 shim, see
    # VALIDATION.md): HF cache snapshot files are RELATIVE symlinks
    # (snapshots/<hash>/config.json -> ../../blobs/<hash2>) - mounting only
    # the snapshots/<hash> directory breaks every symlink, since blobs/
    # lives in the PARENT dir, outside the mount. Must mount the whole
    # models--org--name cache root so the relative ../../blobs/ still
    # resolves inside the container.
    model_path: "/models/gemma3-12b-cache/snapshots/fc5f782bd0a995f66f59c68dd3ab2f888ba65f1a"
    engine: "vllm"
    port: 8000
    volumes:
      /home/nullraptor/.cache/huggingface/hub/models--mlabonne--gemma-3-12b-it-abliterated: /models/gemma3-12b-cache
      # GOTCHA (found via a real crash - `oneCCL: ze_fd_manager.cpp:144
      # init_device_fds: EXCEPTION: opendir failed`): passing the whole
      # /dev/dri directory as a device (see vllm.py's `devices` output) is
      # NOT enough by itself - the real vllm-urak container ALSO bind-mounts
      # /dev/dri/by-path (oneCCL's GPU-topology discovery needs it). This is
      # a plain volume mount, not a device passthrough, so it can't be
      # generated by the engine translator (EngineInvocation has no
      # `volumes` field, only command/env/devices) - every vLLM suite needs
      # this mounted explicitly.
      /dev/dri/by-path: /dev/dri/by-path
    params:
      shared:
        context_size: 8192
      backend_specific:
        served_model_name: "gemma-3-12b-it-abliterated"
        trust_remote_code: true
    health_path: "/health"
    startup_timeout_s: 300
    network:
      mode: disabled

device_target:
  mode: indices
  indices: [3]   # same idle B70 (PCI 0000:8a:00.0) used for every backend validated so far

execution_target:
  mode: local

benchmark_adapters:
  - adapter: generic-http
    config:
      model: "gemma-3-12b-it-abliterated"
      prompt: "In one sentence, what is a hash table?"
      max_tokens: 64
      num_requests: 3

coherence_adapters:
  - adapter: fixed-questions
    config:
      model: "gemma-3-12b-it-abliterated"

storage:
  flat_file_dir: "./results"
  extra_adapters: []

min_free_vram_mb: 4096
allow_unknown_vram: false
