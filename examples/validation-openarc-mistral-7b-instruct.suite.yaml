# Untested (per `llapdance models --results-dir`) - part of the
# remaining-catalog sweep before pruning decisions.
name: validation-openarc-mistral-7b-instruct

backends:
  - name: openarc-mistral-7b-instruct
    source:
      mode: prebuilt
      image: "openarc:dev"
    model: "mistral-7b-instruct-v0.1-fp16-ov"
    model_path: "/models/mistral-7b-instruct"
    engine: "openarc"
    port: 8000
    volumes:
      /mnt/ignite/LLM/models/OpenVINO/mistral-7b-instruct-v0.1-fp16-ov: /models/mistral-7b-instruct
    params:
      backend_specific:
        model_name: "mistral-7b-instruct"
        model_type: "llm"
        openarc_engine: "ovgenai"
    health_path: "/v1/models"
    startup_timeout_s: 120
    network:
      mode: disabled

device_target:
  mode: indices
  indices: [3]

execution_target:
  mode: local

benchmark_adapters:
  - adapter: generic-http
    config:
      model: "mistral-7b-instruct"
      prompt: "In one sentence, what is a hash table?"
      max_tokens: 64
      num_requests: 3

coherence_adapters:
  - adapter: fixed-questions
    config:
      model: "mistral-7b-instruct"

storage:
  flat_file_dir: "./results"
  extra_adapters: []

min_free_vram_mb: 4096
allow_unknown_vram: false
