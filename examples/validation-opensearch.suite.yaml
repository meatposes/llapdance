# Validates the opensearch storage adapter for real, as an EXTRA adapter
# alongside the always-on flat-file default (SPEC.md §8) - see
# VALIDATION.md "OpenSearch storage adapter" section.
#
# Reuses the already-validated qxmx backend config rather than testing a
# new engine here - this suite is about proving storage fan-out works, not
# re-validating an engine.
#
# SECURITY NOTE: `password` below is a placeholder on purpose - this file
# is committed to the repo. Real credentials belong in a CLI override
# (`--set storage.extra_adapters.0.config.password=...`) or your own
# untracked local suite file, never baked into a suite you intend to commit.
name: validation-opensearch

backends:
  - name: qxmx-validation
    source:
      mode: prebuilt
      image: "qxmx:latest"
    model: "Ternary-Bonsai-27B-Q2_0"
    model_path: "/models/Ternary-Bonsai-27B-Q2_0.gguf"
    engine: "qxmx"
    port: 8080
    volumes:
      /mnt/ignite/LLM/huggingface/gguf/Ternary-Bonsai-27B-gguf: /models
    params:
      shared:
        context_size: 4096
        kv_cache_quant: "q8_0"
    health_path: "/health"
    startup_timeout_s: 120
    network:
      mode: disabled

device_target:
  mode: indices
  indices: [3]

execution_target:
  mode: local

benchmark_adapters:
  - adapter: generic-http
    config:
      prompt: "In one sentence, what is a hash table?"
      max_tokens: 64
      num_requests: 3

coherence_adapters:
  - adapter: fixed-questions
    config: {}

storage:
  flat_file_dir: "./results"
  extra_adapters:
    - adapter: opensearch
      config:
        host: "localhost"
        port: 9200
        username: "admin"
        password: "CHANGE_ME"
        use_ssl: true
        verify_certs: false
        index: "llapdance-results"

min_free_vram_mb: 4096
allow_unknown_vram: false
