# Untested (per `llapdance models --results-dir`) - real target from the
# catalog sweep. A reasoning model (DeepSeek-R1-Distill): max_tokens bumped
# to 512 (vs the usual 64) after the OpenVINO/Qwen3-0.6B session finding
# that <think> traces get truncated before an answer at small budgets,
# producing a false coherence failure rather than a real one.
name: validation-openarc-deepseek-r1-distill-7b

backends:
  - name: openarc-deepseek-r1-distill-7b
    source:
      mode: prebuilt
      image: "openarc:dev"
    model: "DeepSeek-R1-Distill-Qwen-7B-int4-ov"
    model_path: "/models/deepseek-r1-7b"
    engine: "openarc"
    port: 8000
    volumes:
      /mnt/ignite/LLM/models/OpenVINO/DeepSeek-R1-Distill-Qwen-7B-int4-ov: /models/deepseek-r1-7b
    params:
      backend_specific:
        model_name: "deepseek-r1-7b"
        model_type: "llm"
        openarc_engine: "ovgenai"
    health_path: "/v1/models"
    startup_timeout_s: 120
    network:
      mode: disabled

device_target:
  mode: indices
  indices: [3]

execution_target:
  mode: local

benchmark_adapters:
  - adapter: generic-http
    config:
      model: "deepseek-r1-7b"
      prompt: "In one sentence, what is a hash table?"
      max_tokens: 512
      num_requests: 3

coherence_adapters:
  - adapter: fixed-questions
    config:
      model: "deepseek-r1-7b"
      max_tokens: 512   # now configurable - see llapdance/plugins/coherence/fixed_questions.py

storage:
  flat_file_dir: "./results"
  extra_adapters: []

min_free_vram_mb: 4096
allow_unknown_vram: false
