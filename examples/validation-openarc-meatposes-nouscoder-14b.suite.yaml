# Untested (per `llapdance models --results-dir`) - part of the
# remaining-catalog sweep before pruning decisions.
name: validation-openarc-meatposes-nouscoder-14b

backends:
  - name: openarc-meatposes-nouscoder-14b
    source:
      mode: prebuilt
      image: "openarc:dev"
    model: "NousCoder-14B-int8-ov"
    model_path: "/models/meatposes-nouscoder-14b"
    engine: "openarc"
    port: 8000
    volumes:
      /mnt/ignite/LLM/models/OpenVINO/MeatPoses/NousCoder-14B-int8-ov: /models/meatposes-nouscoder-14b
    params:
      backend_specific:
        model_name: "meatposes-nouscoder-14b"
        model_type: "llm"
        openarc_engine: "ovgenai"
    health_path: "/v1/models"
    startup_timeout_s: 120
    network:
      mode: disabled

device_target:
  mode: indices
  indices: [3]

execution_target:
  mode: local

benchmark_adapters:
  - adapter: generic-http
    config:
      model: "meatposes-nouscoder-14b"
      prompt: "In one sentence, what is a hash table?"
      max_tokens: 64
      num_requests: 3

coherence_adapters:
  - adapter: fixed-questions
    config:
      model: "meatposes-nouscoder-14b"
      max_tokens: 512   # real gap in the first pass: mislabeled as non-reasoning, but output showed <think> traces truncated at the default 64 - see VALIDATION.md

storage:
  flat_file_dir: "./results"
  extra_adapters: []

min_free_vram_mb: 4096
allow_unknown_vram: false
