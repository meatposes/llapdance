# Untested (per `llapdance models --results-dir`) - part of the
# remaining-catalog sweep before pruning decisions.
name: validation-openarc-deepseek-r1-distill-1.5b

backends:
  - name: openarc-deepseek-r1-distill-1.5b
    source:
      mode: prebuilt
      image: "openarc:dev"
    model: "DeepSeek-R1-Distill-Qwen-1.5B-int4-ov"
    model_path: "/models/deepseek-r1-distill-1.5b"
    engine: "openarc"
    port: 8000
    volumes:
      /mnt/ignite/LLM/models/OpenVINO/DeepSeek-R1-Distill-Qwen-1.5B-int4-ov: /models/deepseek-r1-distill-1.5b
    params:
      backend_specific:
        model_name: "deepseek-r1-distill-1.5b"
        model_type: "llm"
        openarc_engine: "ovgenai"
    health_path: "/v1/models"
    startup_timeout_s: 120
    network:
      mode: disabled

device_target:
  mode: indices
  indices: [3]

execution_target:
  mode: local

benchmark_adapters:
  - adapter: generic-http
    config:
      model: "deepseek-r1-distill-1.5b"
      prompt: "In one sentence, what is a hash table?"
      max_tokens: 64
      num_requests: 3

coherence_adapters:
  - adapter: fixed-questions
    config:
      model: "deepseek-r1-distill-1.5b"
      max_tokens: 512   # reasoning-capable family, avoid <think> truncation false-negative

storage:
  flat_file_dir: "./results"
  extra_adapters: []

min_free_vram_mb: 4096
allow_unknown_vram: false
