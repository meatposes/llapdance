# Real end-to-end validation run - see VALIDATION.md for the full writeup.
# Updated 2026-08-01 to use the llama-cpp-sycl EngineTranslator instead of
# raw command/env/devices passthrough (compare against git history of this
# file for what the raw version looked like, or examples/validation-qxmx.suite.yaml's
# comments for the equivalent gotchas on the qxmx side).
#
# Reuses the already-validated llama-cpp-bonsai:meat6-hardened image
# (llama.cpp SYCL server) against a real Intel Arc GPU, on a *different*
# container name/port/device than the already-running production instance
# so it doesn't disturb it.
name: validation-run

backends:
  - name: bonsai-validation
    source:
      mode: prebuilt
      image: "llama-cpp-bonsai:meat6-hardened"
    # NOTE: Ternary-Bonsai-27B-dspark-Q4_1.gguf was tried first and crashed
    # with a tokenizer-init SIGSEGV - invalid test setup, not a real bug:
    # "-dspark" is a speculative-decode draft artifact, not a standalone
    # servable model. See VALIDATION.md "Retracted claim" section. Q2_0
    # below is a real, standalone, already-proven-good model.
    model: "Ternary-Bonsai-27B-Q2_0"
    model_path: "/models/Ternary-Bonsai-27B-Q2_0.gguf"
    engine: "llama-cpp-sycl"
    port: 8080
    volumes:
      /mnt/ignite/LLM/huggingface/gguf/Ternary-Bonsai-27B-gguf: /models
    params:
      shared:
        context_size: 4096
        batch_size: 2048
        # REQUIRED for this model - not optional fork-specific fluff (an
        # earlier version of this suite/translator guessed it was and
        # omitted it, which broke every coherence-check answer, see
        # VALIDATION.md "params translation layer" section). This model's
        # chat template auto-enables reasoning/thinking; without this,
        # answers go into a hidden reasoning_content field and
        # message.content comes back empty.
        reasoning: "off"
    health_path: "/health"
    startup_timeout_s: 180
    network:
      mode: disabled

# Same physical GPU (xpumcli device_id 3, PCI 0000:8a:00.0, /dev/dri/renderD131)
# used in examples/validation-qxmx.suite.yaml - confirmed idle via
# probe.discover_devices() before writing this. GPU pinning itself is now
# generated by the llama-cpp-sycl translator from this resolved device
# (render-node-only passthrough - no ONEAPI_DEVICE_SELECTOR guessing, see
# VALIDATION.md "params translation layer" section for why).
device_target:
  mode: indices
  indices: [3]

execution_target:
  mode: local

benchmark_adapters:
  - adapter: generic-http
    config:
      prompt: "In one sentence, what is a hash table?"
      max_tokens: 64
      num_requests: 3

coherence_adapters:
  - adapter: fixed-questions
    config: {}   # no llm_judge configured - ambiguous answers count as failures, see VALIDATION.md

storage:
  flat_file_dir: "./results"
  extra_adapters: []

# Real VRAM preflight now runs (xpumcli-backed, see core/probe.py) instead
# of being bypassed with allow_unknown_vram.
min_free_vram_mb: 4096
allow_unknown_vram: false
