# Untested (per `llapdance models --results-dir`) - part of the
# remaining-catalog sweep before pruning decisions.
name: validation-openarc-meatposes-omega-directive-24b

backends:
  - name: openarc-meatposes-omega-directive-24b
    source:
      mode: prebuilt
      image: "openarc:dev"
    model: "Omega-Directive-24B-Unslop-v2-int4-ov"
    model_path: "/models/meatposes-omega-directive-24b"
    engine: "openarc"
    port: 8000
    volumes:
      /mnt/ignite/LLM/models/OpenVINO/MeatPoses/Omega-Directive-24B-Unslop-v2-int4-ov: /models/meatposes-omega-directive-24b
    params:
      backend_specific:
        model_name: "meatposes-omega-directive-24b"
        model_type: "llm"
        openarc_engine: "ovgenai"
    health_path: "/v1/models"
    startup_timeout_s: 120
    network:
      mode: disabled

device_target:
  mode: indices
  indices: [3]

execution_target:
  mode: local

benchmark_adapters:
  - adapter: generic-http
    config:
      model: "meatposes-omega-directive-24b"
      prompt: "In one sentence, what is a hash table?"
      max_tokens: 64
      num_requests: 3

coherence_adapters:
  - adapter: fixed-questions
    config:
      model: "meatposes-omega-directive-24b"

storage:
  flat_file_dir: "./results"
  extra_adapters: []

min_free_vram_mb: 4096
allow_unknown_vram: false
