# Untested (per `llapdance models --results-dir`) - part of the
# remaining-catalog sweep before pruning decisions.
name: validation-openarc-echo9zulu-phi4-mini

backends:
  - name: openarc-echo9zulu-phi4-mini
    source:
      mode: prebuilt
      image: "openarc:dev"
    model: "Phi-4-mini-instruct-int4_asym-awq-se-ov"
    model_path: "/models/echo9zulu-phi4-mini"
    engine: "openarc"
    port: 8000
    volumes:
      /mnt/ignite/LLM/models/OpenVINO/Echo9Zulu/Phi-4-mini-instruct-int4_asym-awq-se-ov: /models/echo9zulu-phi4-mini
    params:
      backend_specific:
        model_name: "echo9zulu-phi4-mini"
        model_type: "llm"
        openarc_engine: "ovgenai"
    health_path: "/v1/models"
    startup_timeout_s: 120
    network:
      mode: disabled

device_target:
  mode: indices
  indices: [3]

execution_target:
  mode: local

benchmark_adapters:
  - adapter: generic-http
    config:
      model: "echo9zulu-phi4-mini"
      prompt: "In one sentence, what is a hash table?"
      max_tokens: 64
      num_requests: 3

coherence_adapters:
  - adapter: fixed-questions
    config:
      model: "echo9zulu-phi4-mini"

storage:
  flat_file_dir: "./results"
  extra_adapters: []

min_free_vram_mb: 4096
allow_unknown_vram: false
