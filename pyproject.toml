[project]
name = "llapdance"
version = "0.1.0"
description = "LLM Automated Pipeline for Deployment, Analysis aNd Coherence Evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "docker>=7.0",
  "httpx>=0.27",
  "textual>=0.58",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.14"]
# Storage is flat-file by default (SPEC.md §8) - opensearch-py is only
# needed if a suite actually configures the opensearch storage adapter.
# Not a core dependency; the adapter module imports it lazily so merely
# having llapdance installed never requires it.
opensearch = ["opensearch-py>=2.4"]
# Only needed to run `llapdance mcp` (SPEC.md §13) - deferred-imported from
# cli.py's mcp() command, not required for the rest of the tool.
mcp = ["mcp>=2.0"]
# Only needed to run the `pinbench` coherence adapter, which shells out to
# a local PinBench checkout (https://github.com/ShadyHippo/PinBench,
# external tool, not vendored - see llapdance/plugins/coherence/pinbench.py)
# using `python_bin` (defaults to this same interpreter). PinBench's own
# providers.py imports the `openai` SDK and `requests` directly.
pinbench = ["openai>=1.0", "requests>=2.31"]

[project.scripts]
llapdance = "llapdance.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llapdance*"]

[tool.pytest.ini_options]
# GOTCHA: an earlier version of this restricted python_classes to "Test_*"
# to silence pytest's warning about colliding with the TestSuite config
# model - that silently excluded every class-based test file from ever
# running (caught only by noticing collected-test count didn't match
# tests actually written). Suppress the specific warning instead; don't
# restrict what pytest is allowed to collect as a test.
filterwarnings = ["ignore:cannot collect test class 'TestSuite':UserWarning"]
