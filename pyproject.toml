[project]
name = "llapdance"
version = "0.1.0"
description = "LLM Automated Pipeline for Deployment, Analysis aNd Coherence Evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "docker>=7.0",
  "httpx>=0.27",
  "textual>=0.58",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.14"]

[project.scripts]
llapdance = "llapdance.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llapdance*"]

[tool.pytest.ini_options]
python_classes = ["Test_*"]  # avoid pytest trying to collect the TestSuite config model
